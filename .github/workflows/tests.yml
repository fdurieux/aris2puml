name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test,check]"
      - run: python -m pytest -q
      - name: Smoke the console script end to end
        run: aris2puml tests/fixtures/order_to_cash.json -o out --check -c tests/fixtures/conventions.toml
